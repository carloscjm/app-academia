name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar o APK
        run: bash gradlew --no-daemon assembleRelease

      - name: Separar o APK
        run: cp app/build/outputs/apk/release/app-release.apk academia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: academia-apk
          path: academia.apk

      - name: Publicar para download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="1.0.${{ github.run_number }}"
          gh release create "v$versao" academia.apk \
            --title "Academia $versao" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            || gh release upload "v$versao" academia.apk --clobber
