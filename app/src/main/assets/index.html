<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Academia</title>
<link rel="stylesheet" href="fonte.css">
<style>
  :root {
    --preto: #000000;
    --verde: #25c866;
    --verde-escuro: #0f3a20;
    --linha: #183324;
    --texto: #eaf6ee;
    --apagado: #7fa08b;
    --musculo: #14432a;
    --titulo: "Big Shoulders Display", "Roboto Condensed", "Arial Narrow", sans-serif;
    --corpo: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    --margem: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--preto);
    color: var(--texto);
    font-family: var(--corpo);
    font-size: 17px;
    line-height: 1.35;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--texto);
    outline-offset: 3px;
  }

  /* Abas */
  .abas {
    display: flex;
    gap: 28px;
    padding: 18px var(--margem) 0;
  }

  .aba {
    font-family: var(--titulo);
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--apagado);
    padding: 6px 0 8px;
    border-bottom: 3px solid transparent;
  }

  .aba[aria-selected="true"] {
    color: var(--texto);
    border-bottom-color: var(--verde);
  }

  .tela { padding: 0 var(--margem); }
  .tela[hidden] { display: none; }

  /* Hoje */
  #hoje { padding-bottom: 132px; }

  .posicao {
    margin: 30px 0 6px;
    color: var(--apagado);
    font-size: 16px;
  }

  .nome {
    margin: 0;
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 80px;
    line-height: 1.04;
    text-transform: uppercase;
    color: var(--verde);
  }

  /* Cada grupo do treino é uma linha: o nome à esquerda e o desenho à direita. */
  .parte {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .parte + .parte { margin-top: 10px; }

  .palavra {
    flex: 1;
    min-width: 0;
  }

  .linha {
    display: block;
    width: max-content;
    white-space: nowrap;
  }

  .figura {
    flex: none;
    width: 36%;
  }

  .figura svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .figura path { fill: var(--musculo); }
  .figura path.aceso { fill: var(--verde); }

  .unica .figura { width: 48%; }
  .unica .pernas .figura { width: 30%; }

  .trilha {
    display: flex;
    gap: 12px;
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
  }

  .trilha li {
    flex: 1;
    display: flex;
    gap: 3px;
  }

  .trilha i {
    flex: 1;
    height: 12px;
    border-radius: 2px;
    background: var(--verde-escuro);
  }

  .trilha i.feito { background: var(--verde); }
  .trilha i.atual { background: var(--texto); }

  .exercicios {
    margin: 30px 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--linha);
  }

  .exercicios li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 0;
    border-bottom: 1px solid var(--linha);
  }

  .exercicios .nome-ex {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .exercicios .vazio { color: var(--apagado); }
  .exercicios li.editavel { align-items: center; }

  .exercicios .series {
    flex: none;
    font-family: var(--titulo);
    font-size: 22px;
    line-height: 1;
    color: var(--apagado);
    white-space: nowrap;
  }

  .acoes { margin-top: 22px; }

  .discreto {
    display: block;
    padding: 10px 0;
    color: var(--apagado);
    font-size: 15px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .discreto[hidden] { display: none; }

  /* Edição dos exercícios */
  .excluir {
    flex: none;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    margin: -9px 0;
    border: 1px solid var(--linha);
    border-radius: 50%;
    color: var(--texto);
  }

  .excluir:active { background: var(--verde-escuro); }

  .edicao { margin-top: 24px; }

  /* Durante a edição não há o botão fixo "Concluir treino". */
  body.editando #hoje { padding-bottom: 40px; }
  body.editando .aviso { bottom: calc(20px + env(safe-area-inset-bottom)); }

  .alcance {
    margin: 0 0 20px;
    color: var(--apagado);
    font-size: 15px;
  }

  .campo {
    display: block;
    margin-bottom: 14px;
  }

  .campo span {
    display: block;
    margin-bottom: 6px;
    color: var(--apagado);
    font-size: 14px;
  }

  .campo input {
    display: block;
    width: 100%;
    height: 50px;
    padding: 0 14px;
    border: 1px solid var(--linha);
    border-radius: 10px;
    background: #06130b;
    color: var(--texto);
    font: inherit;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  .campo input:focus { border-color: var(--verde); }

  .par {
    display: flex;
    gap: 12px;
  }

  .par .campo {
    flex: 1;
    min-width: 0;
  }

  .adicionar, .pronto {
    display: block;
    width: 100%;
    height: 54px;
    border-radius: 14px;
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.01em;
  }

  .adicionar {
    margin-top: 4px;
    border: 2px solid var(--verde);
    color: var(--verde);
  }

  .adicionar:active { background: var(--verde-escuro); }

  .pronto {
    margin: 12px 0 8px;
    background: var(--verde);
    color: var(--preto);
  }

  .pronto:active { background: #1ea956; }

  .rodape {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 28px var(--margem) calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0), var(--preto) 34%);
  }

  .rodape[hidden] { display: none; }

  .concluir {
    display: block;
    width: 100%;
    height: 64px;
    border-radius: 14px;
    background: var(--verde);
    color: var(--preto);
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.01em;
  }

  .concluir:active { background: #1ea956; }
  .concluir:focus-visible { outline-color: var(--texto); }

  .aviso {
    position: fixed;
    left: var(--margem);
    right: var(--margem);
    bottom: calc(104px + env(safe-area-inset-bottom));
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--verde-escuro);
    color: var(--texto);
    font-size: 15px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 160ms ease, transform 160ms ease;
    pointer-events: none;
  }

  .aviso.visivel { opacity: 1; transform: none; }

  .troca { animation: troca 240ms ease-out; }

  @keyframes troca {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* Ciclo */
  #ciclo { padding-bottom: 40px; }

  .ciclos-feitos {
    margin: 30px 0 0;
    color: var(--apagado);
    font-size: 16px;
  }

  .semana { margin-top: 30px; }
  .ciclos-feitos + .semana { margin-top: 22px; }

  .semana h2 {
    margin: 0 0 8px;
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 30px;
    line-height: 1;
    color: var(--texto);
  }

  .treino { border-top: 1px solid var(--linha); }
  .semana .treino:last-child { border-bottom: 1px solid var(--linha); }

  .treino summary {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    list-style: none;
    cursor: pointer;
  }

  .treino summary::-webkit-details-marker { display: none; }

  .treino .numero {
    flex: none;
    width: 16px;
    font-family: var(--titulo);
    font-size: 22px;
    line-height: 1;
    color: var(--apagado);
  }

  .treino .titulo { flex: 1; }
  .treino.feito .titulo { color: var(--apagado); }
  .treino.atual .titulo { color: var(--verde); font-weight: 500; }

  .treino .estado {
    flex: none;
    font-size: 14px;
    color: var(--apagado);
  }

  .treino.atual .estado {
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--verde);
    color: var(--preto);
    font-weight: 500;
  }

  .treino ul {
    margin: 0;
    padding: 0 0 12px 30px;
    list-style: none;
    font-size: 15px;
    color: var(--apagado);
  }

  .treino ul li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 5px 0;
  }

  .treino ul span { flex: none; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .troca { animation: none; }
    .aviso { transition: none; }
  }
</style>
</head>
<body>

<nav class="abas" role="tablist" aria-label="Telas">
  <button class="aba" id="aba-hoje" role="tab" aria-controls="hoje" aria-selected="true">Hoje</button>
  <button class="aba" id="aba-ciclo" role="tab" aria-controls="ciclo" aria-selected="false">Ciclo</button>
</nav>

<main>
  <section class="tela" id="hoje" role="tabpanel" aria-labelledby="aba-hoje">
    <div id="conteudo-hoje">
      <p class="posicao" id="posicao"></p>
      <h1 class="nome" id="nome"></h1>
    </div>
    <ol class="trilha" id="trilha"></ol>
    <ul class="exercicios" id="exercicios"></ul>
    <div class="acoes" id="acoes">
      <button class="discreto" id="editar">Editar exercícios</button>
      <button class="discreto" id="desfazer" hidden>Desfazer última conclusão</button>
    </div>

    <div class="edicao" id="edicao" hidden>
      <p class="alcance" id="alcance"></p>
      <form id="novo" autocomplete="off" novalidate>
        <label class="campo">
          <span>Novo exercício</span>
          <input id="novo-nome" type="text" maxlength="60" enterkeyhint="next" autocapitalize="sentences">
        </label>
        <div class="par">
          <label class="campo">
            <span>Séries</span>
            <input id="novo-series" type="text" inputmode="numeric" maxlength="2" enterkeyhint="next">
          </label>
          <label class="campo">
            <span>Repetições</span>
            <input id="novo-reps" type="text" maxlength="16" enterkeyhint="done">
          </label>
        </div>
        <button class="adicionar" type="submit">Adicionar exercício</button>
      </form>
      <button class="pronto" id="pronto">Pronto</button>
      <button class="discreto" id="restaurar" hidden>Restaurar lista sugerida</button>
    </div>
  </section>

  <section class="tela" id="ciclo" role="tabpanel" aria-labelledby="aba-ciclo" hidden></section>
</main>

<div class="rodape" id="rodape">
  <button class="concluir" id="concluir">Concluir treino</button>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

        ["base", "M27,185C30.2,182.8 40.8,182.8 44,185C47.2,187.2 49.2,195.8 46,198C42.8,200.2 28.2,200.2 25,198C21.8,195.8 23.8,187.2 27,185ZM103,185C99.8,182.8 89.2,182.8 86,185C82.8,187.2 80.8,195.8 84,198C87.2,200.2 101.8,200.2 105,198C108.2,195.8 106.2,187.2 103,185Z"]
      ]
    }
  };

  // A ordem do ciclo: 4 semanas, 5 treinos cada.
  var SEMANAS = [
    ["peitoTriceps", "costasBiceps", "pernas", "ombros", "tricepsBiceps"],
    ["peitoOmbroAnt", "costasOmbroPost", "pernas", "tricepsBiceps", "ombros"],
    ["peitoTriceps", "costasBiceps", "pernas", "ombros", "peitoCostas"],
    ["pernasAnt", "peitoOmbroAnt", "costasOmbroPost", "pernasPost", "tricepsBiceps"]
  ];

  var POR_SEMANA = 5;
  var TOTAL = SEMANAS.length * POR_SEMANA;

  // ---------- Armazenamento local ----------
  var CHAVE = "academia.estado";

  function lerBruto() {
    try {
      if (window.AndroidStore) {
        var v = window.AndroidStore.ler();
        if (v) return v;
      }
    } catch (e) {}
    try { return localStorage.getItem(CHAVE); } catch (e) { return null; }
  }

  function gravarBruto(texto) {
    try { if (window.AndroidStore) window.AndroidStore.gravar(texto); } catch (e) {}
    try { localStorage.setItem(CHAVE, texto); } catch (e) {}
  }

  var MAX_EXERCICIOS = 40;

  function limparLista(lista) {
    var limpa = [];
    lista.forEach(function (ex) {
      if (!Array.isArray(ex) || typeof ex[0] !== "string" || !ex[0].trim()) return;
      limpa.push([ex[0].trim().slice(0, 60), typeof ex[1] === "string" ? ex[1].trim().slice(0, 30) : ""]);
    });
    return limpa.slice(0, MAX_EXERCICIOS);
  }

  function carregar() {
    // "listas" guarda só os treinos que você editou; os outros usam a lista sugerida.
    var estado = { pos: 0, ciclos: 0, listas: {} };
    try {
      var dado = JSON.parse(lerBruto() || "null");
      if (dado && Number.isInteger(dado.pos) && dado.pos >= 0 && dado.pos < TOTAL) estado.pos = dado.pos;
      if (dado && Number.isInteger(dado.ciclos) && dado.ciclos >= 0) estado.ciclos = dado.ciclos;
      if (dado && dado.listas && typeof dado.listas === "object") {
        Object.keys(TREINOS).forEach(function (chave) {
          if (Array.isArray(dado.listas[chave])) estado.listas[chave] = limparLista(dado.listas[chave]);
        });
      }
    } catch (e) {}
    return estado;
  }

  function salvar() {
    gravarBruto(JSON.stringify({ pos: estado.pos, ciclos: estado.ciclos, listas: estado.listas }));
  }

  var estado = carregar();

  // ---------- Ajuda ----------
  function $(id) { return document.getElementById(id); }

  function el(tag, classe, texto) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function chaveEm(pos) {
    return SEMANAS[Math.floor(pos / POR_SEMANA)][pos % POR_SEMANA];
  }

  function treinoEm(pos) {
    return TREINOS[chaveEm(pos)];
  }

  // Os exercícios de um treino: a lista que você editou ou, se não editou, a sugerida.
  function listaDe(chave) {
    return estado.listas[chave] || TREINOS[chave].exercicios;
  }

  // ---------- Tela Hoje ----------
  // Cada linha do nome ocupa a largura que sobra ao lado do desenho, sem passar da altura dele.
  function ajustarNome() {
    document.querySelectorAll("#nome .parte").forEach(function (parte) {
      var palavra = parte.querySelector(".palavra");
      var largura = palavra.clientWidth;
      if (!largura) return;
      palavra.style.fontSize = "100px";
      var linhas = palavra.querySelectorAll(".linha");
      var maior = 0;
      linhas.forEach(function (l) { maior = Math.max(maior, l.getBoundingClientRect().width); });
      if (!maior) return;
      var alturaFigura = parte.querySelector(".figura").getBoundingClientRect().height;
      var porLargura = 100 * largura / maior;
      var porAltura = alturaFigura / (linhas.length * 1.04);
      palavra.style.fontSize = Math.floor(Math.min(porLargura, porAltura)) + "px";
    });
  }

  function desenharFigura(nome, acesos) {
    var figura = FIGURAS[nome];
    var caminhos = figura.pecas.map(function (peca) {
      return '<path' + (acesos.indexOf(peca[0]) >= 0 ? ' class="aceso"' : '') + ' d="' + peca[1] + '"/>';
    }).join("");
    var caixa = el("span", "figura");
    caixa.innerHTML = '<svg viewBox="' + figura.caixa + '" aria-hidden="true">' + caminhos + '</svg>';
    return caixa;
  }

  function desenharHoje() {
    var semana = Math.floor(estado.pos / POR_SEMANA) + 1;
    var numero = (estado.pos % POR_SEMANA) + 1;
    var treino = treinoEm(estado.pos);

    $("posicao").textContent = "Semana " + semana + ", treino " + numero + " de " + POR_SEMANA;

    var nome = $("nome");
    nome.textContent = "";
    nome.setAttribute("aria-label", treino.nome);
    nome.className = "nome" + (treino.partes.length === 1 ? " unica" : "");
    treino.partes.forEach(function (parte) {
      var linha = el("span", "parte" + (parte.figura.indexOf("pernas") === 0 ? " pernas" : ""));
      var palavra = el("span", "palavra");
      parte.linhas.forEach(function (texto) { palavra.appendChild(el("span", "linha", texto)); });
      linha.appendChild(palavra);
      linha.appendChild(desenharFigura(parte.figura, parte.acesos));
      nome.appendChild(linha);
    });

    var trilha = $("trilha");
    trilha.textContent = "";
    trilha.setAttribute("aria-label", "Treino " + (estado.pos + 1) + " de " + TOTAL + " no ciclo");
    for (var s = 0; s < SEMANAS.length; s++) {
      var grupo = el("li");
      for (var t = 0; t < POR_SEMANA; t++) {
        var p = s * POR_SEMANA + t;
        grupo.appendChild(el("i", p < estado.pos ? "feito" : p === estado.pos ? "atual" : ""));
      }
      trilha.appendChild(grupo);
    }

    var chave = chaveEm(estado.pos);
    var exercicios = listaDe(chave);
    var lista = $("exercicios");
    lista.textContent = "";
    exercicios.forEach(function (ex, indice) {
      var li = el("li", editando ? "editavel" : null);
      li.appendChild(el("span", "nome-ex", ex[0]));
      if (ex[1]) li.appendChild(el("span", "series", ex[1]));
      if (editando) {
        var botao = el("button", "excluir");
        botao.type = "button";
        botao.setAttribute("aria-label", "Excluir " + ex[0]);
        botao.innerHTML = ICONE_EXCLUIR;
        botao.addEventListener("click", function () { excluirExercicio(indice); });
        li.appendChild(botao);
      }
      lista.appendChild(li);
    });
    if (!exercicios.length) lista.appendChild(el("li", "vazio", "Nenhum exercício neste treino."));

    document.body.classList.toggle("editando", editando);
    $("acoes").hidden = editando;
    $("edicao").hidden = !editando;
    $("desfazer").hidden = estado.pos === 0 && estado.ciclos === 0;
    $("alcance").textContent = "O que você mudar vale para todos os treinos de " + treino.nome + " do ciclo.";
    $("restaurar").hidden = !estado.listas[chave];
    armarRestaurar(false);
    atualizarRodape();
    ajustarNome();
  }

  // ---------- Tela Ciclo ----------
  function desenharCiclo() {
    var tela = $("ciclo");
    tela.textContent = "";

    if (estado.ciclos > 0) {
      tela.appendChild(el("p", "ciclos-feitos",
        estado.ciclos === 1 ? "1 ciclo completo" : estado.ciclos + " ciclos completos"));
    }

    SEMANAS.forEach(function (chaves, s) {
      var bloco = el("div", "semana");
      bloco.appendChild(el("h2", null, "Semana " + (s + 1)));
      chaves.forEach(function (chave, t) {
        var p = s * POR_SEMANA + t;
        var treino = TREINOS[chave];
        var situacao = p < estado.pos ? "feito" : p === estado.pos ? "atual" : "";
        var det = el("details", "treino " + situacao);
        var resumo = el("summary");
        resumo.appendChild(el("span", "numero", String(t + 1)));
        resumo.appendChild(el("span", "titulo", treino.nome));
        if (situacao === "feito") resumo.appendChild(el("span", "estado", "Concluído"));
        if (situacao === "atual") resumo.appendChild(el("span", "estado", "Hoje"));
        det.appendChild(resumo);
        var ul = el("ul");
        listaDe(chave).forEach(function (ex) {
          var li = el("li");
          li.appendChild(document.createTextNode(ex[0]));
          if (ex[1]) li.appendChild(el("span", null, ex[1]));
          ul.appendChild(li);
        });
        det.appendChild(ul);
        bloco.appendChild(det);
      });
      tela.appendChild(bloco);
    });
  }

  // ---------- Ações ----------
  var relogioAviso = null;

  function avisar(texto) {
    var aviso = $("aviso");
    aviso.textContent = texto;
    aviso.classList.add("visivel");
    clearTimeout(relogioAviso);
    relogioAviso = setTimeout(function () { aviso.classList.remove("visivel"); }, 2600);
  }

  function animarTroca() {
    ["conteudo-hoje", "exercicios"].forEach(function (id) {
      var n = $(id);
      n.classList.remove("troca");
      void n.offsetWidth;
      n.classList.add("troca");
    });
  }

  function concluir() {
    estado.pos += 1;
    var fechouCiclo = estado.pos >= TOTAL;
    if (fechouCiclo) {
      estado.pos = 0;
      estado.ciclos += 1;
    }
    salvar();
    desenharHoje();
    desenharCiclo();
    animarTroca();
    window.scrollTo(0, 0);
    avisar(fechouCiclo ? "Ciclo completo. De volta à semana 1." : "Treino concluído");
  }

  function desfazer() {
    if (estado.pos > 0) {
      estado.pos -= 1;
    } else if (estado.ciclos > 0) {
      estado.pos = TOTAL - 1;
      estado.ciclos -= 1;
    } else {
      return;
    }
    salvar();
    desenharHoje();
    desenharCiclo();
    animarTroca();
    window.scrollTo(0, 0);
    avisar("Conclusão desfeita");
  }

  // ---------- Edição dos exercícios do treino do dia ----------
  var editando = false;
  var ICONE_EXCLUIR = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">' +
    '<path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  // A mudança vale para o tipo do treino (ex.: todo "Pernas"), não só para o dia.
  function editarLista(mudar) {
    var chave = chaveEm(estado.pos);
    var nova = listaDe(chave).slice();
    mudar(nova);
    estado.listas[chave] = nova;
    salvar();
    desenharHoje();
    desenharCiclo();
  }

  function formatarSeries(series, reps) {
    series = series.replace(/\D/g, "").replace(/^0+/, "");
    reps = reps.trim().replace(/\s*[-–—]\s*/g, "–");
    if (series && reps) return series + " × " + reps;
    if (series) return series + (series === "1" ? " série" : " séries");
    if (/^\d+(–\d+)?$/.test(reps)) return reps + " reps";
    return reps;
  }

  function adicionarExercicio(evento) {
    evento.preventDefault();
    var nome = $("novo-nome").value.trim();
    if (!nome) {
      $("novo-nome").focus();
      avisar("Escreva o nome do exercício");
      return;
    }
    if (listaDe(chaveEm(estado.pos)).length >= MAX_EXERCICIOS) {
      avisar("Este treino já tem " + MAX_EXERCICIOS + " exercícios");
      return;
    }
    var series = formatarSeries($("novo-series").value, $("novo-reps").value);
    editarLista(function (lista) { lista.push([nome.slice(0, 60), series]); });
    $("novo").reset();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    avisar("Exercício adicionado");
  }

  function excluirExercicio(indice) {
    editarLista(function (lista) { lista.splice(indice, 1); });
    avisar("Exercício excluído");
  }

  // Restaurar apaga o que você adicionou, então pede um segundo toque.
  var relogioRestaurar = null;

  function armarRestaurar(armado) {
    var botao = $("restaurar");
    clearTimeout(relogioRestaurar);
    botao.dataset.armado = armado ? "1" : "";
    botao.textContent = armado ? "Toque de novo para restaurar" : "Restaurar lista sugerida";
    if (armado) relogioRestaurar = setTimeout(function () { armarRestaurar(false); }, 3500);
  }

  function restaurar() {
    if (!$("restaurar").dataset.armado) {
      armarRestaurar(true);
      return;
    }
    delete estado.listas[chaveEm(estado.pos)];
    salvar();
    desenharHoje();
    desenharCiclo();
    avisar("Lista sugerida restaurada");
  }

  // ---------- Navegação entre as telas ----------
  // Ciclo e edição usam o hash, então o botão voltar do Android retorna para Hoje.
  var telaAtual = null;

  function atualizarRodape() {
    $("rodape").hidden = location.hash === "#ciclo" || editando;
  }

  function mostrarTela() {
    var tela = location.hash === "#ciclo" ? "ciclo" : location.hash === "#editar" ? "editar" : "hoje";
    var noCiclo = tela === "ciclo";
    editando = tela === "editar";
    $("hoje").hidden = noCiclo;
    $("ciclo").hidden = !noCiclo;
    $("aba-hoje").setAttribute("aria-selected", String(!noCiclo));
    $("aba-ciclo").setAttribute("aria-selected", String(noCiclo));
    if (noCiclo) atualizarRodape();
    else desenharHoje();
    if (noCiclo || telaAtual === "ciclo" || telaAtual === null) window.scrollTo(0, 0);
    telaAtual = tela;
  }

  // Depois de mudar o hash, já redesenha, sem esperar o evento hashchange.
  $("aba-ciclo").addEventListener("click", function () {
    if (location.hash === "#editar") location.replace("#ciclo");
    else if (location.hash !== "#ciclo") location.hash = "#ciclo";
    mostrarTela();
  });

  $("aba-hoje").addEventListener("click", function () {
    if (location.hash === "#ciclo") history.back();
  });

  $("editar").addEventListener("click", function () {
    location.hash = "#editar";
    mostrarTela();
  });
  $("pronto").addEventListener("click", function () {
    if (location.hash === "#editar") history.back();
  });
  $("novo").addEventListener("submit", adicionarExercicio);
  $("restaurar").addEventListener("click", restaurar);

  window.addEventListener("hashchange", mostrarTela);
  window.addEventListener("resize", ajustarNome);
  $("concluir").addEventListener("click", concluir);
  $("desfazer").addEventListener("click", desfazer);

  desenharCiclo();
  mostrarTela();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarNome);
})();
</script>
</body>
