<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Academia</title>
<link rel="stylesheet" href="fonte.css">
<style>
  :root {
    --preto: #000000;
    --verde: #25c866;
    --verde-escuro: #0f3a20;
    --linha: #183324;
    --texto: #eaf6ee;
    --apagado: #7fa08b;
    --titulo: "Big Shoulders Display", "Roboto Condensed", "Arial Narrow", sans-serif;
    --corpo: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    --margem: 20px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--preto);
    color: var(--texto);
    font-family: var(--corpo);
    font-size: 17px;
    line-height: 1.35;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--texto);
    outline-offset: 3px;
  }

  /* Abas */
  .abas {
    display: flex;
    gap: 28px;
    padding: 18px var(--margem) 0;
  }

  .aba {
    font-family: var(--titulo);
    font-size: 24px;
    letter-spacing: 0.01em;
    color: var(--apagado);
    padding: 6px 0 8px;
    border-bottom: 3px solid transparent;
  }

  .aba[aria-selected="true"] {
    color: var(--texto);
    border-bottom-color: var(--verde);
  }

  .tela { padding: 0 var(--margem); }
  .tela[hidden] { display: none; }

  /* Hoje */
  #hoje { padding-bottom: 132px; }

  .posicao {
    margin: 30px 0 6px;
    color: var(--apagado);
    font-size: 16px;
  }

  .nome {
    margin: 0;
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 80px;
    line-height: 1.04;
    text-transform: uppercase;
    color: var(--verde);
  }

  .nome span {
    display: block;
    width: max-content;
    white-space: nowrap;
  }

  .trilha {
    display: flex;
    gap: 12px;
    margin: 26px 0 0;
    padding: 0;
    list-style: none;
  }

  .trilha li {
    flex: 1;
    display: flex;
    gap: 3px;
  }

  .trilha i {
    flex: 1;
    height: 12px;
    border-radius: 2px;
    background: var(--verde-escuro);
  }

  .trilha i.feito { background: var(--verde); }
  .trilha i.atual { background: var(--texto); }

  .exercicios {
    margin: 30px 0 0;
    padding: 0;
    list-style: none;
    border-top: 1px solid var(--linha);
  }

  .exercicios li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 15px 0;
    border-bottom: 1px solid var(--linha);
  }

  .exercicios .series {
    flex: none;
    font-family: var(--titulo);
    font-size: 22px;
    line-height: 1;
    color: var(--apagado);
    white-space: nowrap;
  }

  .desfazer {
    display: block;
    margin: 22px 0 0;
    padding: 10px 0;
    color: var(--apagado);
    font-size: 15px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .desfazer[hidden] { display: none; }

  .rodape {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 28px var(--margem) calc(20px + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0), var(--preto) 34%);
  }

  .rodape[hidden] { display: none; }

  .concluir {
    display: block;
    width: 100%;
    height: 64px;
    border-radius: 14px;
    background: var(--verde);
    color: var(--preto);
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.01em;
  }

  .concluir:active { background: #1ea956; }
  .concluir:focus-visible { outline-color: var(--texto); }

  .aviso {
    position: fixed;
    left: var(--margem);
    right: var(--margem);
    bottom: calc(104px + env(safe-area-inset-bottom));
    padding: 13px 16px;
    border-radius: 12px;
    background: var(--verde-escuro);
    color: var(--texto);
    font-size: 15px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 160ms ease, transform 160ms ease;
    pointer-events: none;
  }

  .aviso.visivel { opacity: 1; transform: none; }

  .troca { animation: troca 240ms ease-out; }

  @keyframes troca {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  /* Ciclo */
  #ciclo { padding-bottom: 40px; }

  .ciclos-feitos {
    margin: 30px 0 0;
    color: var(--apagado);
    font-size: 16px;
  }

  .semana { margin-top: 30px; }
  .ciclos-feitos + .semana { margin-top: 22px; }

  .semana h2 {
    margin: 0 0 8px;
    font-family: var(--titulo);
    font-weight: 800;
    font-size: 30px;
    line-height: 1;
    color: var(--texto);
  }

  .treino { border-top: 1px solid var(--linha); }
  .semana .treino:last-child { border-bottom: 1px solid var(--linha); }

  .treino summary {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    list-style: none;
    cursor: pointer;
  }

  .treino summary::-webkit-details-marker { display: none; }

  .treino .numero {
    flex: none;
    width: 16px;
    font-family: var(--titulo);
    font-size: 22px;
    line-height: 1;
    color: var(--apagado);
  }

  .treino .titulo { flex: 1; }
  .treino.feito .titulo { color: var(--apagado); }
  .treino.atual .titulo { color: var(--verde); font-weight: 500; }

  .treino .estado {
    flex: none;
    font-size: 14px;
    color: var(--apagado);
  }

  .treino.atual .estado {
    padding: 3px 10px;
    border-radius: 99px;
    background: var(--verde);
    color: var(--preto);
    font-weight: 500;
  }

  .treino ul {
    margin: 0;
    padding: 0 0 12px 30px;
    list-style: none;
    font-size: 15px;
    color: var(--apagado);
  }

  .treino ul li {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 5px 0;
  }

  .treino ul span { flex: none; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .troca { animation: none; }
    .aviso { transition: none; }
  }
</style>
</head>
<body>

<nav class="abas" role="tablist" aria-label="Telas">
  <button class="aba" id="aba-hoje" role="tab" aria-controls="hoje" aria-selected="true">Hoje</button>
  <button class="aba" id="aba-ciclo" role="tab" aria-controls="ciclo" aria-selected="false">Ciclo</button>
</nav>

<main>
  <section class="tela" id="hoje" role="tabpanel" aria-labelledby="aba-hoje">
    <div id="conteudo-hoje">
      <p class="posicao" id="posicao"></p>
      <h1 class="nome" id="nome"></h1>
    </div>
    <ol class="trilha" id="trilha"></ol>
    <ul class="exercicios" id="exercicios"></ul>
    <button class="desfazer" id="desfazer" hidden>Desfazer última conclusão</button>
  </section>

  <section class="tela" id="ciclo" role="tabpanel" aria-labelledby="aba-ciclo" hidden></section>
</main>

<div class="rodape" id="rodape">
  <button class="concluir" id="concluir">Concluir treino</button>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  // ---------- Treinos ----------
  var TREINOS = {
    peitoTriceps: {
      nome: "Peito / Tríceps", linhas: ["Peito", "Tríceps"],
      exercicios: [
        ["Supino reto com barra", "4 × 8–10"],
        ["Supino inclinado com halteres", "3 × 10–12"],
        ["Peck deck", "3 × 12–15"],
        ["Tríceps na polia com corda", "3 × 10–12"],
        ["Tríceps testa", "3 × 10–12"]
      ]
    },
    costasBiceps: {
      nome: "Costas / Bíceps", linhas: ["Costas", "Bíceps"],
      exercicios: [
        ["Puxada frontal", "4 × 8–10"],
        ["Remada curvada", "3 × 8–10"],
        ["Remada baixa", "3 × 10–12"],
        ["Pulldown", "3 × 12–15"],
        ["Rosca direta", "3 × 10–12"],
        ["Rosca martelo", "3 × 10–12"]
      ]
    },
    pernas: {
      nome: "Pernas", linhas: ["Pernas"],
      exercicios: [
        ["Agachamento livre", "4 × 8–10"],
        ["Leg press 45°", "3 × 10–12"],
        ["Cadeira extensora", "3 × 12–15"],
        ["Mesa flexora", "3 × 10–12"],
        ["Stiff", "3 × 10–12"],
        ["Panturrilha em pé", "4 × 12–15"]
      ]
    },
    ombros: {
      nome: "Ombros", linhas: ["Ombros"],
      exercicios: [
        ["Desenvolvimento com halteres", "4 × 8–10"],
        ["Elevação lateral", "4 × 12–15"],
        ["Elevação frontal", "3 × 12"],
        ["Crucifixo inverso", "3 × 12–15"],
        ["Encolhimento", "3 × 12"]
      ]
    },
    tricepsBiceps: {
      nome: "Tríceps / Bíceps", linhas: ["Tríceps", "Bíceps"],
      exercicios: [
        ["Rosca com barra W", "4 × 8–10"],
        ["Tríceps na polia com barra", "4 × 10–12"],
        ["Rosca alternada", "3 × 10–12"],
        ["Tríceps francês", "3 × 10–12"],
        ["Rosca Scott", "3 × 10–12"],
        ["Tríceps coice", "3 × 12–15"]
      ]
    },
    peitoOmbroAnt: {
      nome: "Peito / Ombro ant.", linhas: ["Peito", "Ombro ant."],
      exercicios: [
        ["Supino inclinado com barra", "4 × 8–10"],
        ["Supino reto com halteres", "3 × 10–12"],
        ["Crossover", "3 × 12–15"],
        ["Desenvolvimento militar", "3 × 8–10"],
        ["Elevação frontal", "3 × 12"]
      ]
    },
    costasOmbroPost: {
      nome: "Costas / Ombro post.", linhas: ["Costas", "Ombro post."],
      exercicios: [
        ["Barra fixa ou puxada", "4 × 8–10"],
        ["Remada cavalinho", "3 × 8–10"],
        ["Remada unilateral", "3 × 10–12"],
        ["Crucifixo inverso", "3 × 12–15"],
        ["Face pull", "3 × 12–15"]
      ]
    },
    peitoCostas: {
      nome: "Peito / Costas", linhas: ["Peito", "Costas"],
      exercicios: [
        ["Supino reto com barra", "4 × 8–10"],
        ["Puxada frontal", "4 × 8–10"],
        ["Supino inclinado com halteres", "3 × 10–12"],
        ["Remada baixa", "3 × 10–12"],
        ["Crossover", "3 × 12–15"],
        ["Pulldown", "3 × 12–15"]
      ]
    },
    pernasAnt: {
      nome: "Pernas ant.", linhas: ["Pernas ant."],
      exercicios: [
        ["Agachamento livre", "4 × 8–10"],
        ["Leg press 45°", "4 × 10–12"],
        ["Afundo búlgaro", "3 × 10 por perna"],
        ["Cadeira extensora", "3 × 12–15"],
        ["Panturrilha em pé", "4 × 12–15"]
      ]
    },
    pernasPost: {
      nome: "Pernas post.", linhas: ["Pernas post."],
      exercicios: [
        ["Stiff", "4 × 8–10"],
        ["Mesa flexora", "4 × 10–12"],
        ["Cadeira flexora", "3 × 12"],
        ["Elevação pélvica", "3 × 10–12"],
        ["Panturrilha sentado", "4 × 15"]
      ]
    }
  };

  // A ordem do ciclo: 4 semanas, 5 treinos cada.
  var SEMANAS = [
    ["peitoTriceps", "costasBiceps", "pernas", "ombros", "tricepsBiceps"],
    ["peitoOmbroAnt", "costasOmbroPost", "pernas", "tricepsBiceps", "ombros"],
    ["peitoTriceps", "costasBiceps", "pernas", "ombros", "peitoCostas"],
    ["pernasAnt", "peitoOmbroAnt", "costasOmbroPost", "pernasPost", "tricepsBiceps"]
  ];

  var POR_SEMANA = 5;
  var TOTAL = SEMANAS.length * POR_SEMANA;

  // ---------- Armazenamento local ----------
  var CHAVE = "academia.estado";

  function lerBruto() {
    try {
      if (window.AndroidStore) {
        var v = window.AndroidStore.ler();
        if (v) return v;
      }
    } catch (e) {}
    try { return localStorage.getItem(CHAVE); } catch (e) { return null; }
  }

  function gravarBruto(texto) {
    try { if (window.AndroidStore) window.AndroidStore.gravar(texto); } catch (e) {}
    try { localStorage.setItem(CHAVE, texto); } catch (e) {}
  }

  function carregar() {
    var estado = { pos: 0, ciclos: 0 };
    try {
      var dado = JSON.parse(lerBruto() || "null");
      if (dado && Number.isInteger(dado.pos) && dado.pos >= 0 && dado.pos < TOTAL) estado.pos = dado.pos;
      if (dado && Number.isInteger(dado.ciclos) && dado.ciclos >= 0) estado.ciclos = dado.ciclos;
    } catch (e) {}
    return estado;
  }

  function salvar() {
    gravarBruto(JSON.stringify({ pos: estado.pos, ciclos: estado.ciclos }));
  }

  var estado = carregar();

  // ---------- Ajuda ----------
  function $(id) { return document.getElementById(id); }

  function el(tag, classe, texto) {
    var n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto != null) n.textContent = texto;
    return n;
  }

  function treinoEm(pos) {
    return TREINOS[SEMANAS[Math.floor(pos / POR_SEMANA)][pos % POR_SEMANA]];
  }

  // ---------- Tela Hoje ----------
  function ajustarNome() {
    var nome = $("nome");
    var largura = nome.clientWidth;
    if (!largura) return;
    nome.style.fontSize = "100px";
    var maior = 0;
    nome.querySelectorAll("span").forEach(function (s) {
      maior = Math.max(maior, s.getBoundingClientRect().width);
    });
    if (!maior) return;
    var tamanho = Math.min(100 * largura / maior, largura * 0.3);
    nome.style.fontSize = Math.floor(tamanho) + "px";
  }

  function desenharHoje() {
    var semana = Math.floor(estado.pos / POR_SEMANA) + 1;
    var numero = (estado.pos % POR_SEMANA) + 1;
    var treino = treinoEm(estado.pos);

    $("posicao").textContent = "Semana " + semana + ", treino " + numero + " de " + POR_SEMANA;

    var nome = $("nome");
    nome.textContent = "";
    nome.setAttribute("aria-label", treino.nome);
    treino.linhas.forEach(function (linha) { nome.appendChild(el("span", null, linha)); });

    var trilha = $("trilha");
    trilha.textContent = "";
    trilha.setAttribute("aria-label", "Treino " + (estado.pos + 1) + " de " + TOTAL + " no ciclo");
    for (var s = 0; s < SEMANAS.length; s++) {
      var grupo = el("li");
      for (var t = 0; t < POR_SEMANA; t++) {
        var p = s * POR_SEMANA + t;
        grupo.appendChild(el("i", p < estado.pos ? "feito" : p === estado.pos ? "atual" : ""));
      }
      trilha.appendChild(grupo);
    }

    var lista = $("exercicios");
    lista.textContent = "";
    treino.exercicios.forEach(function (ex) {
      var li = el("li");
      li.appendChild(el("span", null, ex[0]));
      li.appendChild(el("span", "series", ex[1]));
      lista.appendChild(li);
    });

    $("desfazer").hidden = estado.pos === 0 && estado.ciclos === 0;
    ajustarNome();
  }

  // ---------- Tela Ciclo ----------
  function desenharCiclo() {
    var tela = $("ciclo");
    tela.textContent = "";

    if (estado.ciclos > 0) {
      tela.appendChild(el("p", "ciclos-feitos",
        estado.ciclos === 1 ? "1 ciclo completo" : estado.ciclos + " ciclos completos"));
    }

    SEMANAS.forEach(function (chaves, s) {
      var bloco = el("div", "semana");
      bloco.appendChild(el("h2", null, "Semana " + (s + 1)));
      chaves.forEach(function (chave, t) {
        var p = s * POR_SEMANA + t;
        var treino = TREINOS[chave];
        var situacao = p < estado.pos ? "feito" : p === estado.pos ? "atual" : "";
        var det = el("details", "treino " + situacao);
        var resumo = el("summary");
        resumo.appendChild(el("span", "numero", String(t + 1)));
        resumo.appendChild(el("span", "titulo", treino.nome));
        if (situacao === "feito") resumo.appendChild(el("span", "estado", "Concluído"));
        if (situacao === "atual") resumo.appendChild(el("span", "estado", "Hoje"));
        det.appendChild(resumo);
        var ul = el("ul");
        treino.exercicios.forEach(function (ex) {
          var li = el("li");
          li.appendChild(document.createTextNode(ex[0]));
          li.appendChild(el("span", null, ex[1]));
          ul.appendChild(li);
        });
        det.appendChild(ul);
        bloco.appendChild(det);
      });
      tela.appendChild(bloco);
    });
  }

  // ---------- Ações ----------
  var relogioAviso = null;

  function avisar(texto) {
    var aviso = $("aviso");
    aviso.textContent = texto;
    aviso.classList.add("visivel");
    clearTimeout(relogioAviso);
    relogioAviso = setTimeout(function () { aviso.classList.remove("visivel"); }, 2600);
  }

  function animarTroca() {
    ["conteudo-hoje", "exercicios"].forEach(function (id) {
      var n = $(id);
      n.classList.remove("troca");
      void n.offsetWidth;
      n.classList.add("troca");
    });
  }

  function concluir() {
    estado.pos += 1;
    var fechouCiclo = estado.pos >= TOTAL;
    if (fechouCiclo) {
      estado.pos = 0;
      estado.ciclos += 1;
    }
    salvar();
    desenharHoje();
    desenharCiclo();
    animarTroca();
    window.scrollTo(0, 0);
    avisar(fechouCiclo ? "Ciclo completo. De volta à semana 1." : "Treino concluído");
  }

  function desfazer() {
    if (estado.pos > 0) {
      estado.pos -= 1;
    } else if (estado.ciclos > 0) {
      estado.pos = TOTAL - 1;
      estado.ciclos -= 1;
    } else {
      return;
    }
    salvar();
    desenharHoje();
    desenharCiclo();
    animarTroca();
    window.scrollTo(0, 0);
    avisar("Conclusão desfeita");
  }

  // ---------- Navegação entre as telas ----------
  // A tela Ciclo usa o hash, então o botão voltar do Android retorna para Hoje.
  function mostrarTela() {
    var noCiclo = location.hash === "#ciclo";
    $("hoje").hidden = noCiclo;
    $("ciclo").hidden = !noCiclo;
    $("rodape").hidden = noCiclo;
    $("aba-hoje").setAttribute("aria-selected", String(!noCiclo));
    $("aba-ciclo").setAttribute("aria-selected", String(noCiclo));
    window.scrollTo(0, 0);
    if (!noCiclo) ajustarNome();
  }

  $("aba-ciclo").addEventListener("click", function () {
    if (location.hash !== "#ciclo") location.hash = "#ciclo";
  });

  $("aba-hoje").addEventListener("click", function () {
    if (location.hash === "#ciclo") history.back();
  });

  window.addEventListener("hashchange", mostrarTela);
  window.addEventListener("resize", ajustarNome);
  $("concluir").addEventListener("click", concluir);
  $("desfazer").addEventListener("click", desfazer);

  desenharHoje();
  desenharCiclo();
  mostrarTela();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarNome);
})();
</script>
</body>
</html>
